name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_commit:
        description: "Immutable commit to check; defaults to the triggering commit"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: resolve immutable quality source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate requested source commit
        id: source
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw 'quality source must be an immutable 40-character commit SHA'
          }
          "commit=$env:SOURCE_COMMIT" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  test:
    needs: source
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Cache cargo registry and target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The embedded client has no npm dependencies. Node's built-in runner
      # exercises the shipped script against delayed synthetic API responses.
      - name: Web client interaction tests
        run: node --test crates/agent-session-grep-cli/tests/web_ui.test.cjs

      # The semantic-candle module is behind a cargo feature, so the default
      # `cargo test --workspace` never compiles it. Run its suite explicitly
      # to keep the feature inside the quality gate; the feature only builds
      # the local candle runtime and downloads no model weights.
      - name: Test semantic-candle feature
        run: cargo test -p agent-session-grep-application --features semantic-candle

      - name: Check semantic-candle entrypoints
        run: cargo check -p agent-session-grep-cli --all-targets --features semantic-candle

      - name: Robot contract tests
        run: cargo test -p agent-session-grep-cli --test e2e robot_ -- --nocapture

      # Python helper suites are stdlib-only unittest and hermetic: synthetic
      # fixtures, no network, no real transcripts. Each scripts/ directory is
      # discovered separately because they are not importable packages, so
      # discovery does not recurse into them.
      - name: Release verifier and entry-point tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Release manifest tests
        run: python -m unittest discover -s scripts/release -p "test_*.py" -v

      # Benchmark, open-source gate, privacy scan, and the regression harness'
      # pure-function suite. The installer job re-runs the regression harness
      # with a release binary present, which unlocks its binary-backed cases.
      - name: Evidence harness tests
        run: python -m unittest discover -s scripts/evidence -p "test_*.py" -v

  installer:
    needs: source
    name: installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Cache cargo registry and target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-installer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-installer-

      - name: Build release binary
        run: cargo build --locked --release -p agent-session-grep-cli

      # Installer scripts only copy an already-built artifact here (--skip-build):
      # the build step above is the reproducible one, and CI must not hide a
      # build failure inside the installer.
      - name: Install into a workspace-local prefix (unix)
        if: runner.os != 'Windows'
        run: ./scripts/install/install.sh --skip-build --prefix "$PWD/ci-prefix"

      - name: Install into a workspace-local prefix (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install/install.ps1 -SkipBuild -Prefix "$PWD/ci-prefix"

      - name: Invoke both installed commands (unix)
        if: runner.os != 'Windows'
        run: |
          ./ci-prefix/agent-session-grep --version
          ./ci-prefix/asg --version
          ./ci-prefix/agent-session-grep --robot config paths
          ./ci-prefix/asg --robot config paths

      - name: Invoke both installed commands (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./ci-prefix/agent-session-grep.exe --version
          ./ci-prefix/asg.exe --version
          ./ci-prefix/agent-session-grep.exe --robot config paths
          ./ci-prefix/asg.exe --robot config paths

      # End-to-end surface smoke against the installed artifact: CLI robot
      # envelopes, documented exit codes, and the MCP stdio handshake.
      - name: Surface smoke (unix)
        if: runner.os != 'Windows'
        run: ./scripts/install/smoke.sh --binary "$PWD/ci-prefix/agent-session-grep" --alias-binary "$PWD/ci-prefix/asg"

      - name: Surface smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install/smoke.ps1 -Binary "$PWD/ci-prefix/agent-session-grep.exe" -AliasBinary "$PWD/ci-prefix/asg.exe"

      # Uninstall must remove exactly the two installer-owned command files and
      # stay idempotent: a second run reports "not installed" and exits 0.
      - name: Uninstall twice (unix)
        if: runner.os != 'Windows'
        run: |
          ./scripts/install/uninstall.sh --prefix "$PWD/ci-prefix"
          test ! -e "$PWD/ci-prefix/agent-session-grep"
          test ! -e "$PWD/ci-prefix/asg"
          test ! -L "$PWD/ci-prefix/asg"
          ./scripts/install/uninstall.sh --prefix "$PWD/ci-prefix"

      - name: Uninstall twice (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install/uninstall.ps1 -Prefix "$PWD/ci-prefix"
          if (Test-Path "$PWD/ci-prefix/agent-session-grep.exe") { throw "uninstall left the canonical command behind" }
          if (Test-Path "$PWD/ci-prefix/asg.exe") { throw "uninstall left the asg alias behind" }
          ./scripts/install/uninstall.ps1 -Prefix "$PWD/ci-prefix"

      # Regression harness self-test runs on synthetic fixtures only; real
      # transcripts are never present in CI.
      - name: Regression harness self-test
        run: python -m unittest discover -s scripts/evidence -p "test_real_data_regression.py" -v

  deny:
    needs: source
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  msrv:
    name: Rust 1.90 all-feature compatibility
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, explicit MSRV
        with:
          toolchain: "1.90.0"
      - name: Check all workspace targets at the declared MSRV
        run: cargo +1.90.0 check --workspace --all-targets --all-features --locked
